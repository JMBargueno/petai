[package]
name = "pockai-core"
version = "0.1.0"
description = "Núcleo cliente de Pockai: red, sesión, tiempo real y contrato con la UI. Rust puro, sin Tauri."
edition = "2021"
publish = false

[features]
default = ["keyring-store"]
# Guarda la sesión en el llavero del sistema (Credential Manager, Keychain, Secret Service).
keyring-store = ["dep:keyring"]

[dependencies]
base64 = "0.22"
eventsource-stream = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# TLS en Rust puro (con ring), el mismo que usa reqwest: sin OpenSSL en ninguna plataforma.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# WebSocket del canal en tiempo real (el cliente de Socket.IO es propio: ver realtime.rs).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ts-rs = { version = "10", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"

# Llavero del sistema: Credential Manager, Keychain (macOS e iOS) o Secret Service. Android no tiene
# uno accesible desde Rust: allí la sesión va a un fichero privado de la app (ver secrets.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"], optional = true }
