[default]
description = "Permite a la UI usar el núcleo cliente de Pockai: acciones y consultas con tipo propio, chat en streaming, sesión, tiempo real, estado global y avisos."
permissions = [
  "allow-chat-stream",
  "allow-chat-cancel",
  "allow-session-state",
  "allow-session-logout",
  "allow-session-import-legacy",
  "allow-realtime-start",
  "allow-realtime-stop",
  "allow-state-snapshot",
  "allow-state-load",
  "allow-state-refresh",
  "allow-state-apply-pet",
  "allow-state-patch-pet",
  "allow-state-select-pet",
  "allow-inbox-push",
  "allow-inbox-take",
  "allow-inbox-mark-all-read",
  "allow-set-present",
  "allow-perform",
  "allow-query",
]
