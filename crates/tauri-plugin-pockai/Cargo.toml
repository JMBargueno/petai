[package]
name = "tauri-plugin-pockai"
version = "0.1.0"
description = "Puente entre el núcleo cliente de Pockai y la UI: commands, events y channels de Tauri."
edition = "2021"
publish = false
links = "tauri-plugin-pockai"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
pockai-core = { path = "../pockai-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tokio = { version = "1", features = ["sync", "macros"] }

# JNI directo para el Keystore y el trabajo en segundo plano (las mismas versiones que usa Tauri).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
