name: Release (instaladores de escritorio)

# Se ejecuta al subir una etiqueta v* (p. ej. v0.1.0). Crea un borrador de release con los instaladores.
# Requiere la variable de repositorio PETAI_API_URL (https://api.tudominio.com, sin /v1).
# Sin certificados de firma los instaladores saldrán sin firmar (Windows avisará de «editor desconocido»);
# para firmar, añade los secretos de Tauri/Apple (ver docs/DEPLOY.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--bundles dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.PETAI_API_URL }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'PetAI ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
