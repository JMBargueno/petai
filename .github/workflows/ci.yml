name: PetAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El token de la CI solo necesita leer el repositorio
permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate-data:
    name: Validate Game Data & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Game Data Integrity
        run: node scripts/validate-game-data.js

      - name: Validate Layered Asset Pipeline
        run: node scripts/validate-assets.js

  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" (package.json): el workspace usa ajustes de pnpm 12
      # (allowBuilds) que pnpm 10 ignora, lo que dejaba sin generar Prisma y sin compilar argon2.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build backend
        run: pnpm --filter petai-backend run build

      # F-09: el contrato único (shared/openapi/openapi.json) debe coincidir con el que se genera
      # desde los controladores. Si un controlador/DTO cambia sin regenerar el JSON, la CI falla.
      # Reutiliza el comando de exportación (no necesita base de datos: stub de Prisma en el script).
      - name: Verify OpenAPI contract is up to date (no drift)
        run: |
          pnpm --filter petai-backend run export:openapi
          if ! git diff --quiet -- shared/openapi/openapi.json; then
            echo "::error::shared/openapi/openapi.json está desfasado respecto a los controladores."
            echo "Ejecuta 'pnpm --filter petai-backend run export:openapi' y commit el fichero regenerado."
            git diff -- shared/openapi/openapi.json
            exit 1
          fi

      - name: Run unit tests
        run: pnpm --filter petai-backend run test

  backend-e2e:
    name: Backend e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: validate-data
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petai_user
          POSTGRES_PASSWORD: petai_password
          POSTGRES_DB: petai_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petai_user -d petai_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://petai_user:petai_password@localhost:5432/petai_dev?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      # Mismo camino que producción: si un modelo no tiene migración, los e2e fallan aquí.
      - name: Apply migrations
        run: pnpm --filter petai-backend exec prisma migrate deploy

      # El esquema y las migraciones deben coincidir (exit 2 si falta una migración).
      - name: Check schema matches migrations
        run: >-
          pnpm --filter petai-backend exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed catalog data
        run: pnpm --filter petai-backend run prisma:seed

      - name: Run e2e tests
        run: pnpm --filter petai-backend run test:e2e

  desktop:
    name: Desktop build (Vite + Tauri)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Svelte + Vite)
        run: pnpm --filter petai-desktop run build

      # Dependencias del sistema de Tauri 2 en Linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Check Tauri (Rust)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

  android:
    name: Android build (Compose)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner ya trae el SDK de Android (ANDROID_HOME); solo se añade la plataforma 37
      - name: Install platform (compileSdk 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # gradle.properties fija -Djdk.net.unixdomain.tmpdir=C:/t (apaño de Windows+JDK 25): en Linux se
      # sustituyen los jvmargs del daemon por unos sin esa ruta.
      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petai-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  docker:
    name: Backend image (Docker build)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t petai-backend:ci .
