name: PetAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones antiguas de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate-data:
    name: Validate Game Data & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Game Data Integrity
        run: node scripts/validate-game-data.js

  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" (package.json): el workspace usa ajustes de pnpm 12
      # (allowBuilds) que pnpm 10 ignora, lo que dejaba sin generar Prisma y sin compilar argon2.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      - name: Build backend
        run: pnpm --filter petai-backend run build

      - name: Run unit tests
        run: pnpm --filter petai-backend run test

  backend-e2e:
    name: Backend e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: validate-data
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petai_user
          POSTGRES_PASSWORD: petai_password
          POSTGRES_DB: petai_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petai_user -d petai_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://petai_user:petai_password@localhost:5432/petai_dev?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      # Aplica todas las migraciones sobre una base de datos vacía (comprueba que arrancan desde cero)
      - name: Apply migrations
        run: pnpm --filter petai-backend exec prisma migrate deploy

      - name: Seed catalog data
        run: pnpm --filter petai-backend run prisma:seed

      - name: Run e2e tests
        run: pnpm --filter petai-backend run test:e2e

  desktop:
    name: Desktop build (Vite + Tauri)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Svelte + Vite)
        run: pnpm --filter petai-desktop run build

      # Dependencias del sistema de Tauri 2 en Linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Check Tauri (Rust)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked

  android:
    name: Android build (Compose)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform (compileSdk 37)
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" || sdkmanager "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # gradle.properties fija -Djdk.net.unixdomain.tmpdir=C:/t (apaño de Windows+JDK 25): en Linux se
      # sustituyen los jvmargs del daemon por unos sin esa ruta.
      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petai-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
