name: PetAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El token de la CI solo necesita leer el repositorio
permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # Detecta qué áreas toca el cambio. En un PR solo corren los jobs de las áreas afectadas; en un push
  # a main corre todo (cada job lo comprueba en su `if`). Tocar este workflow o el lockfile activa todo.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    # paths-filter lista los ficheros del PR por la API: necesita leer los pull requests.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      ui-visual: ${{ steps.filter.outputs.ui-visual }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            common: &common
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            rust: &rust
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'desktop/src-tauri/**'
            backend:
              - *common
              - 'backend/**'
              - 'shared/mind/**'
              - 'shared/minigames/**'
              - 'shared/audio/**'
              - 'shared/scene/**'
              - 'shared/game-data/**'
              - 'shared/openapi/**'
              - 'shared/assets/**'
            web:
              - *common
              - 'web/**'
              - 'shared/scene/**'
              - 'shared/audio/**'
              - 'shared/mind/**'
              - 'shared/assets/**'
              - 'shared/game-data/**'
              - 'scripts/generate-pattern-previews.mjs'
              - 'scripts/lib/**'
            desktop:
              - *common
              - *rust
              - 'desktop/**'
              - 'apps/**'
              - 'shared/**'
              # tiempo_real usa el socket.io instalado en backend/node_modules
              - 'backend/package.json'
            android:
              - *common
              - *rust
              - 'desktop/**'
              - 'apps/android/**'
              - 'shared/**'
            ios:
              - *rust
              # El reloj (spec 44). Su proyecto vive en `gen/apple`, que `*rust` ya cubre por
              # `desktop/src-tauri/**`, pero su arte se hornea desde `shared/`: sin esto, regenerar
              # sprites o iconos no dispararía el job que los compila.
              - 'shared/assets/**'
              - 'shared/ui/src/icons/**'
              - '.github/workflows/ci.yml'
            ui-visual:
              - *common
              - 'apps/android/**'
              - 'shared/**'
            docker:
              - *common
              - 'backend/**'
              - 'shared/**'
              - '.dockerignore'

  # Corre siempre y en paralelo: es barato y no bloquea el arranque del resto.
  validate-data:
    name: Validate Game Data & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Game Data Integrity
        run: node scripts/validate-game-data.js

      - name: Validate Layered Asset Pipeline
        run: node scripts/validate-assets.js

      # Los componentes pintan con tokens de tema: ningún color fijo nuevo en la UI.
      - name: Validate UI colors (themes)
        run: node scripts/validate-ui-colors.js

  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" (package.json): el workspace usa ajustes de pnpm 12
      # (allowBuilds) que pnpm 10 ignora, lo que dejaba sin generar Prisma y sin compilar argon2.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # El backend y sus paquetes del workspace, más la raíz: `pnpm generate:api` usa
      # openapi-typescript, que es devDependency de la raíz.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter petai-backend... --filter petai-monorepo

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      # Lee el lockfile completo: audita todo el monorepo aunque el install esté filtrado.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build backend
        run: pnpm --filter petai-backend run build

      # F-09: el contrato único (shared/openapi/openapi.json) debe coincidir con el que se genera
      # desde los controladores. Si un controlador/DTO cambia sin regenerar el JSON, la CI falla.
      # Reutiliza el comando de exportación (no necesita base de datos: stub de Prisma en el script).
      - name: Verify OpenAPI contract is up to date (no drift)
        run: |
          pnpm --filter petai-backend run export:openapi
          if ! git diff --quiet -- shared/openapi/openapi.json; then
            echo "::error::shared/openapi/openapi.json está desfasado respecto a los controladores."
            echo "Ejecuta 'pnpm --filter petai-backend run export:openapi' y commit el fichero regenerado."
            git diff -- shared/openapi/openapi.json
            exit 1
          fi

      # F-09 (completo): además del JSON, los tipos generados que consume el escritorio
      # (shared/openapi/api-types.ts, vía openapi-typescript) deben coincidir con los regenerados
      # a partir de openapi.json. Así ningún PR puede desincronizar el contrato de los clientes.
      - name: Verify generated client types are up to date (no drift)
        run: |
          pnpm generate:api
          if ! git diff --quiet -- shared/openapi/api-types.ts; then
            echo "::error::shared/openapi/api-types.ts está desfasado respecto a shared/openapi/openapi.json."
            echo "Ejecuta 'pnpm generate:api' (raíz) y commit el fichero regenerado."
            git diff -- shared/openapi/api-types.ts
            exit 1
          fi

      - name: Run unit tests
        run: pnpm --filter petai-backend run test

  backend-e2e:
    name: Backend e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petai_user
          POSTGRES_PASSWORD: petai_password
          POSTGRES_DB: petai_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petai_user -d petai_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://petai_user:petai_password@localhost:5432/petai_dev?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter petai-backend...

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      # Mismo camino que producción: si un modelo no tiene migración, los e2e fallan aquí.
      - name: Apply migrations
        run: pnpm --filter petai-backend exec prisma migrate deploy

      # El esquema y las migraciones deben coincidir (exit 2 si falta una migración).
      - name: Check schema matches migrations
        run: >-
          pnpm --filter petai-backend exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed catalog data
        run: pnpm --filter petai-backend run prisma:seed

      - name: Run e2e tests
        run: pnpm --filter petai-backend run test:e2e

  web:
    name: Web build & tests (Angular)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Los scripts de la raíz que usa el build (generate-pattern-previews) solo usan builtins de Node.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter pockai-web...

      - name: Run unit tests
        run: pnpm --filter pockai-web run test

      # Compila es/en, prerenderiza la landing y falla si falta alguna traducción
      - name: Build static site
        run: pnpm --filter pockai-web run build

  # Paquetes TS/Svelte del cliente: @pockai/* compartidos, las UIs móviles y el frontend del escritorio.
  # Cada fase lanza los paquetes en paralelo (se consumen desde fuente, no dependen de builds ajenos).
  ts-packages:
    name: TS packages (shared, mobile UIs, desktop frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Minijuegos (spec 39), escena compartida, biblioteca de UI, núcleo cliente (spec 43) y app móvil
      # compartida (spec 43, fase 4).
      - name: Typecheck shared packages
        run: >-
          pnpm --parallel
          --filter @pockai/minigames
          --filter @pockai/scene
          --filter @pockai/ui
          --filter @pockai/client
          --filter @pockai/mobile
          run typecheck

      - name: Svelte check (UI, mobile, Android and iOS UIs)
        run: >-
          pnpm --parallel
          --filter @pockai/ui
          --filter @pockai/mobile
          --filter @pockai/android-ui
          --filter @pockai/ios-ui
          run check

      # Determinismo y techo de puntos de los minijuegos, protocolo/efectos/fondos de la escena,
      # plataforma y temas de la UI, acciones y chat del núcleo cliente, y la lógica del escritorio.
      - name: Unit tests
        run: >-
          pnpm --parallel
          --filter @pockai/minigames
          --filter @pockai/scene
          --filter @pockai/ui
          --filter @pockai/client
          --filter petai-desktop
          run test

      # Único build de @pockai/ios-ui de la CI (ios-tauri solo compila el núcleo en Rust).
      - name: Build mobile UIs and desktop frontend (Vite)
        run: >-
          pnpm --parallel
          --filter @pockai/android-ui
          --filter @pockai/ios-ui
          --filter petai-desktop
          run build

  # Shell de Tauri y crates del núcleo cliente (spec 43), en paralelo con los paquetes TS.
  rust-desktop:
    name: Rust workspace (Tauri shell + core)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Dependencias del sistema de Tauri 2 en Linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      # tiempo_real arranca un servidor Socket.IO con el paquete instalado en backend/node_modules.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install backend dependencies (for the realtime test)
        run: pnpm install --frozen-lockfile --filter petai-backend...

      # Workspace de Rust: el shell de Tauri y los crates del núcleo cliente (spec 43).
      - name: Check Rust workspace
        run: cargo check --workspace --locked

      # Núcleo cliente contra un backend simulado: sesión, renovación única, mantenimiento y chat.
      # De paso regenera los tipos del contrato para la UI (ts-rs).
      - name: Test core (Rust)
        run: cargo test -p pockai-core --locked

      # Canal en tiempo real contra un servidor Socket.IO de verdad (el paquete del backend).
      - name: Test core realtime
        run: cargo test -p pockai-core --locked --test tiempo_real -- --ignored

      - name: Core contract types are up to date
        run: |
          git diff --exit-code -- shared/client/src/bindings || {
            echo "::error::Los tipos del contrato están desactualizados. Ejecuta: cargo test -p pockai-core export_bindings"
            exit 1
          }

  # Tests visuales del kit: el muestrario en cada plataforma (desktop/android/ios) × tema × esquema.
  # Miden tamaños y colores calculados y dejan una captura de cada combinación en el informe.
  ui-visual:
    name: UI visual (plataformas y temas)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ui-visual == 'true'
    # Imagen oficial con Chromium y sus dependencias ya instalados. La versión debe coincidir con la de
    # @playwright/test del lockfile (hoy 1.65.1): al subirla, actualiza también esta línea.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @pockai/android-ui...

      - name: Run visual tests
        run: pnpm --filter @pockai/android-ui run test:visual

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-report
          path: apps/android/playwright-report
          retention-days: 14

  # La app de Tauri para Android (spec 43): el mismo shell y el mismo núcleo que el escritorio, con la
  # UI de apps/android. Compila el APK de depuración para el emulador (x86_64).
  android-tauri:
    name: Android app (Tauri)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner ya trae el SDK y el NDK de Android; solo se añade la plataforma 37
      - name: Install platform (compileSdk 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
          key: android

      # Caché de Gradle (distribución, dependencias y build cache) para el proyecto Android generado.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build APK (debug, x86_64)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm --filter petai-desktop exec tauri android build --debug --target x86_64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pockai-android-tauri-debug
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  # La app de Tauri para iOS (spec 43, fase 4). Compila el núcleo para el simulador; no construye el
  # .ipa, que exige firma y un Team ID de Apple y no cabe en un PR de rama. La UI de iOS se comprueba
  # y compila en ts-packages (Linux), así este runner de macOS no instala Node.
  ios-tauri:
    name: iOS app (Tauri)
    runs-on: macos-15
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ios == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
          key: ios

      # El núcleo cliente y el shell móvil, compilados para el simulador: keyring (Keychain) y
      # rustls tienen que seguir compilando para Apple.
      - name: Build core for the iOS simulator
        run: cargo build -p petai-desktop --lib --target aarch64-apple-ios-sim

      # El reloj (spec 44). No sale del `tauri ios build` —ese pasa un `-sdk iphonesimulator`
      # global que pisa el SDKROOT de los targets de watchOS—, así que se compila aparte. Solo
      # compilar: no hace falta arrancar ningún simulador.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build the Apple Watch app
        working-directory: desktop/src-tauri/gen/apple
        run: |
          xcodegen generate
          xcodebuild -project petai-desktop.xcodeproj -target PockaiWatch \
            -configuration debug -sdk watchsimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/pockai-watch" build

      # Lo único que impide que los dos lados del cable se separen sin que nadie se entere: compara
      # clave a clave el JSON que escribe Rust con el que escriben los tipos de Swift.
      - name: Check the watch contract (Rust ↔ Swift)
        working-directory: desktop/src-tauri/gen/apple
        run: |
          swiftc -O Shared/PockaiWrist.swift Tests/PockaiWristFixture.swift \
            -o "$RUNNER_TEMP/pockai-wrist-fixture"
          "$RUNNER_TEMP/pockai-wrist-fixture" \
            ../../../../crates/pockai-core/tests/fixtures/wrist-snapshot.json

  docker:
    name: Backend image (Docker build)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Solo se construye (no se publica); las capas se cachean en la caché de Actions.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          tags: petai-backend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
