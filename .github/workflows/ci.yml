name: PetAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El token de la CI solo necesita leer el repositorio
permissions:
  contents: read

# Cancela ejecuciones antiguas de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate-data:
    name: Validate Game Data & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Game Data Integrity
        run: node scripts/validate-game-data.js

      - name: Validate Layered Asset Pipeline
        run: node scripts/validate-assets.js

      # Los componentes pintan con tokens de tema: ningún color fijo nuevo en la UI.
      - name: Validate UI colors (themes)
        run: node scripts/validate-ui-colors.js

  backend:
    name: Backend build & unit tests
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" (package.json): el workspace usa ajustes de pnpm 12
      # (allowBuilds) que pnpm 10 ignora, lo que dejaba sin generar Prisma y sin compilar argon2.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build backend
        run: pnpm --filter petai-backend run build

      # F-09: el contrato único (shared/openapi/openapi.json) debe coincidir con el que se genera
      # desde los controladores. Si un controlador/DTO cambia sin regenerar el JSON, la CI falla.
      # Reutiliza el comando de exportación (no necesita base de datos: stub de Prisma en el script).
      - name: Verify OpenAPI contract is up to date (no drift)
        run: |
          pnpm --filter petai-backend run export:openapi
          if ! git diff --quiet -- shared/openapi/openapi.json; then
            echo "::error::shared/openapi/openapi.json está desfasado respecto a los controladores."
            echo "Ejecuta 'pnpm --filter petai-backend run export:openapi' y commit el fichero regenerado."
            git diff -- shared/openapi/openapi.json
            exit 1
          fi

      # F-09 (completo): además del JSON, los tipos generados que consume el escritorio
      # (shared/openapi/api-types.ts, vía openapi-typescript) deben coincidir con los regenerados
      # a partir de openapi.json. Así ningún PR puede desincronizar el contrato de los clientes.
      - name: Verify generated client types are up to date (no drift)
        run: |
          pnpm generate:api
          if ! git diff --quiet -- shared/openapi/api-types.ts; then
            echo "::error::shared/openapi/api-types.ts está desfasado respecto a shared/openapi/openapi.json."
            echo "Ejecuta 'pnpm generate:api' (raíz) y commit el fichero regenerado."
            git diff -- shared/openapi/api-types.ts
            exit 1
          fi

      - name: Run unit tests
        run: pnpm --filter petai-backend run test

  backend-e2e:
    name: Backend e2e (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: validate-data
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petai_user
          POSTGRES_PASSWORD: petai_password
          POSTGRES_DB: petai_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U petai_user -d petai_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://petai_user:petai_password@localhost:5432/petai_dev?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter petai-backend exec prisma generate

      # Mismo camino que producción: si un modelo no tiene migración, los e2e fallan aquí.
      - name: Apply migrations
        run: pnpm --filter petai-backend exec prisma migrate deploy

      # El esquema y las migraciones deben coincidir (exit 2 si falta una migración).
      - name: Check schema matches migrations
        run: >-
          pnpm --filter petai-backend exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Seed catalog data
        run: pnpm --filter petai-backend run prisma:seed

      - name: Run e2e tests
        run: pnpm --filter petai-backend run test:e2e

  web:
    name: Web build & tests (Angular)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter pockai-web run test

      # Compila es/en, prerenderiza la landing y falla si falta alguna traducción
      - name: Build static site
        run: pnpm --filter pockai-web run build

  desktop:
    name: Desktop build (Vite + Tauri)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Minijuegos compartidos (spec 39): determinismo y techo de puntos frente a balance.json.
      - name: Test shared minigames
        run: |
          pnpm --filter @pockai/minigames run typecheck
          pnpm --filter @pockai/minigames run test

      # Escena compartida (escritorio y WebView de Android/iOS): protocolo, efectos, fondos por capas
      # y el paseo de la aventura diaria.
      - name: Test shared scene
        run: |
          pnpm --filter @pockai/scene run typecheck
          pnpm --filter @pockai/scene run test

      # Biblioteca de UI: plataforma (desktop/android/ios), apariencia y registro de temas.
      - name: Test shared UI
        run: |
          pnpm --filter @pockai/ui run typecheck
          pnpm --filter @pockai/ui run check
          pnpm --filter @pockai/ui run test

      # Lado de la UI del núcleo cliente (spec 43): acciones, consultas y el canal del chat.
      - name: Test core client
        run: |
          pnpm --filter @pockai/client run typecheck
          pnpm --filter @pockai/client run test

      # UI de Android (Tauri): solo presentación sobre el núcleo.
      - name: Build Android UI
        run: |
          pnpm --filter @pockai/android-ui run check
          pnpm --filter @pockai/android-ui run build

      # Lógica del escritorio (cargador de assets, tema, notificaciones…).
      - name: Test desktop
        run: pnpm --filter petai-desktop run test

      - name: Build frontend (Svelte + Vite)
        run: pnpm --filter petai-desktop run build

      # Dependencias del sistema de Tauri 2 en Linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      # Workspace de Rust: el shell de Tauri y los crates del núcleo cliente (spec 43).
      - name: Check Rust workspace
        run: cargo check --workspace --locked

      # Núcleo cliente contra un backend simulado: sesión, renovación única, mantenimiento y chat.
      # De paso regenera los tipos del contrato para la UI (ts-rs).
      - name: Test core (Rust)
        run: cargo test -p pockai-core --locked

      # Canal en tiempo real contra un servidor Socket.IO de verdad (el paquete del backend).
      - name: Test core realtime
        run: cargo test -p pockai-core --locked --test tiempo_real -- --ignored

      - name: Core contract types are up to date
        run: |
          git diff --exit-code -- shared/client/src/bindings || {
            echo "::error::Los tipos del contrato están desactualizados. Ejecuta: cargo test -p pockai-core export_bindings"
            exit 1
          }

  # Tests visuales del kit: el muestrario en cada plataforma (desktop/android/ios) × tema × esquema.
  # Miden tamaños y colores calculados y dejan una captura de cada combinación en el informe.
  ui-visual:
    name: UI visual (plataformas y temas)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pockai/android-ui exec playwright install --with-deps chromium

      - name: Run visual tests
        run: pnpm --filter @pockai/android-ui run test:visual

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-report
          path: apps/android/playwright-report
          retention-days: 14

  # La app de Tauri para Android (spec 43): el mismo shell y el mismo núcleo que el escritorio, con la
  # UI de apps/android. Compila el APK de depuración para el emulador (x86_64).
  android-tauri:
    name: Android app (Tauri)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner ya trae el SDK y el NDK de Android; solo se añade la plataforma 37
      - name: Install platform (compileSdk 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
          key: android

      - name: Build APK (debug, x86_64)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm --filter petai-desktop exec tauri android build --debug --target x86_64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pockai-android-tauri-debug
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  docker:
    name: Backend image (Docker build)
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t petai-backend:ci .
