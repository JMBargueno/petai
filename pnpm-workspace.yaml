packages:
  - 'backend'
  - 'desktop'
  - 'edge'
  - 'web'
  - 'shared/*'
  - 'tools/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@cloudflare/workerd-linux-64': true
  '@cloudflare/workerd-macos-arm64': true
  '@cloudflare/workerd-windows-64': true
  '@parcel/watcher': false
  argon2: true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  workerd: true

overrides:
  deepmerge-ts: '>=8.0.0'
  # GHSA-7589-6fvf-x4pw: ReDoS en effect <=3.22.0. Llega vía backend > @prisma/client > prisma >
  # @prisma/config. Quitar cuando Prisma dependa de una versión parcheada.
  effect: '^3.22.1'

# Avisos de `pnpm audit` aceptados a sabiendas. Revisar cada uno cuando salga un parche y quitarlo.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7, ReDoS con extglobs repetidos. Sin versión parcheada (2026-11-18). Solo llega
    # vía web > @angular/localize > tinyglobby, en tiempo de build, con patrones propios y no del
    # usuario, así que no es explotable aquí.
    - GHSA-fc5q-39xc-vjpf
