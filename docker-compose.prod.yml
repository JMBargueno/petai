# Despliegue de referencia en un solo servidor. Uso:
#   cp .env.example .env   # y rellenar los secretos (ver docs/DEPLOY.md)
#   docker compose -f docker-compose.prod.yml up -d --build
# Pon delante un proxy con TLS (Caddy, Nginx, Traefik…) que apunte al puerto 3000 del backend.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-petai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-petai}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?define JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?define JWT_REFRESH_SECRET}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:?define AI_KEY_ENCRYPTION_KEY}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      # ---- Observabilidad (OpenTelemetry) ----
      OTEL_SERVICE_NAME: "petai-backend"
      OTEL_SERVICE_VERSION: "0.1.0"
      # En producción los traces van a Grafana Tempo / Cloud (OTLP). Si no se define, el SDK
      # queda desactivado de forma segura y solo se expone /metrics por prom-client.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
      # Sampling 10–20% en producción (FR-013) para controlar la cardinalidad.
      OTEL_TRACES_SAMPLER_ARG: "0.15"
      OTEL_METRICS_EXPORTER: "prometheus"
      METRICS_PORT: "9464"
      # `--expose-gc` (defensa en profundidad junto al CMD del Dockerfile): habilita la
      # medición de pausas de GC (`petai_gc_pause_seconds`) para la alerta `LongGCPause` (SC-006).
      NODE_OPTIONS: "--expose-gc"
    ports:
      - "127.0.0.1:3000:3000" # API pública
      # 9464 NO expuesto al host — solo accesible desde la red interna de Docker (FR-012).

  # ---- Observabilidad ----
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      backend: { condition: service_started }

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    environment:
      # El webhook de Slack se inyecta por archivo (no se expone el valor en el compose).
      SLACK_WEBHOOK_URL_FILE: /etc/alertmanager/slack-webhook-url

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
