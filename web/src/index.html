<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pockai</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dceeff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0c19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Landing «Coming soon» y mantenimiento: si la última configuración conocida tiene activa la
      landing (sin sesión verificada) o el mantenimiento de la web (sin sesión de admin), o aún no se
      conoce, se oculta la página prerenderizada hasta que la app decida.
      Mismas rutas exentas que src/app/coming-soon/gate.ts. A los 5 s se muestra igualmente.
    -->
    <style>
      html.gate-pending body { background: #0b0a14; }
      html.gate-pending app-root { visibility: hidden; }
    </style>
    <script>
      (function () {
        try {
          if (/^\/[a-z]{2}\/admin(\/|$)/.test(location.pathname)) return;
          var config = JSON.parse(localStorage.getItem('pockai.siteConfig') || 'null');
          var session = JSON.parse(localStorage.getItem('pockai.session') || 'null');
          var user = session && session.user;
          if (config) {
            var m = config.maintenance;
            var admin = !!(user && user.permissions && user.permissions.indexOf('admin:access') >= 0);
            var maintenance = !!(m && m.enabled && m.scope !== 'apps') && !admin;
            var soon = !!(config.comingSoon && config.comingSoon.enabled) && !(user && user.emailVerified);
            if (!maintenance && !soon) return;
          }
          var root = document.documentElement;
          root.classList.add('gate-pending');
          setTimeout(function () { root.classList.remove('gate-pending'); }, 5000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
