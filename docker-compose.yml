services:
  postgres:
    image: postgres:17-alpine
    container_name: petai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petai_user
      POSTGRES_PASSWORD: petai_password
      POSTGRES_DB: petai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petai_user -d petai_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petai-net

  redis:
    image: redis:7-alpine
    container_name: petai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - petai-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  petai-net:
    driver: bridge
