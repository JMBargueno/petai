[package]
name = "petai-desktop"
version = "0.1.0"
description = "PetAI — Mascota virtual inteligente de escritorio"
authors = ["PetAI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

# Perfil de release endurecido (docs/specs/spec-38-endurecimiento-desktop.md):
# binario más pequeño, sin símbolos y con el código optimizado como una sola unidad,
# lo que dificulta la ingeniería inversa. No afecta a `cargo check`/`cargo test` (perfil dev).
[profile.release]
opt-level = "z"     # optimiza por tamaño
lto = true          # Link-Time Optimization entre crates
codegen-units = 1   # una sola unidad de generación: mejor optimización (build más lento)
panic = "abort"     # sin tablas de unwinding; un panic termina el proceso
strip = true        # elimina símbolos y nombres de funciones del binario
