[package]
name = "petai-desktop"
version = "0.1.0"
description = "PetAI — Mascota virtual inteligente de escritorio"
authors = ["PetAI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }

# Ubicación nativa del equipo (src/location.rs): se queda en el equipo, solo para el clima.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }
